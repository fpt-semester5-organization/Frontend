<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:image" content="/logo.png" />
    <meta name="theme-color" content="#3d5c47" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeggieLife - Nền tảng dinh dưỡng chay thông minh</title>
    <meta
      name="description"
      content="Công thức chay có định lượng rõ ràng, video nấu ăn và kinh nghiệm từ cộng đồng người ăn chay Việt Nam."
    />
    <!-- Font của design system Linen & Earth: Merriweather (tiêu đề), Work Sans (nội dung), Material Symbols (icon).
         Material Symbols chỉ nạp trục đang dùng (opsz 24, wght 400, GRAD 0, FILL 0–1) để tệp font nhỏ; display=block để không hiện chữ tên icon.
         CSS font nạp kiểu media="print" rồi đổi sang "all" khi tải xong để không chặn lần vẽ đầu (Lighthouse di động);
         nếu sau này thêm Content-Security-Policy chặn script inline thì phải cho phép handler onload này. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Work+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
